<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terrain HD prototype</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #view { position: absolute; inset: 0; }
      #view canvas { display: block; width: 100%; height: 100%; }
      #hud { position: absolute; left: 8px; bottom: 8px; color: #3cff9e; font: 12px monospace; pointer-events: none; text-shadow: 0 0 2px #000; white-space: pre; background: #000a; padding: 4px 6px; }
      #bar { position: absolute; left: 8px; right: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
      #bar a, #bar button { color: #ffb030; font: 12px monospace; background: #12151a; padding: 4px 6px; border: 1px solid #3a414b; text-decoration: none; cursor: pointer; }
      #bar .on { color: #12151a; background: #ffb030; }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <nav id="bar"></nav>
    <div id="hud"></div>
    <script type="module" src="./terrain.ts"></script>
  </body>
</html>
