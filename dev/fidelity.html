<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fidelity comparison</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
      #bar { position: absolute; left: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 4px; max-width: calc(100% - 16px); }
      #bar a { color: #ffb030; font: 12px monospace; background: #12151acc; padding: 3px 6px; border: 1px solid #3a414b; text-decoration: none; }
      #bar a.on { color: #12151a; background: #ffb030; }
      #hud { position: absolute; left: 8px; bottom: 8px; color: #3cff9e; font: 12px monospace; white-space: pre; text-shadow: 0 0 2px #000, 0 0 2px #000; pointer-events: none; }
      body.clean #bar, body.clean #hud { display: none; }
    </style>
  </head>
  <body>
    <nav id="bar"></nav>
    <div id="hud"></div>
    <script type="module" src="./fidelity.ts"></script>
  </body>
</html>
